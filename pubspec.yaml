name: azkar
description: "رفيق المسلم - Muslim Companion Islamic App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Local Storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Prayer Times
  adhan: ^2.0.0+1

  # Location & Compass
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_compass: ^0.8.0
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # HTTP
  http: ^1.2.2

  # Audio
  just_audio: ^0.9.42
  audio_session: ^0.1.25

  # Video
  video_player: ^2.9.3
  chewie: ^1.8.5

  # Timezone (required for flutter_local_notifications zonedSchedule)
  timezone: ^0.10.0

  # PDF Viewer
  flutter_pdfview: ^1.4.0

  # Utilities
  share_plus: ^10.1.4
  vibration: ^2.0.0
  intl: ^0.20.2
  hijri: ^3.0.0
  audio_service: ^0.18.18
  url_launcher: ^6.3.1
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter_native_splash:
  background_image: "assets/images/flash_fullscreen.jpg"
  background_image_dark: "assets/images/flash_fullscreen.jpg"
  android_12:
    image: "assets/images/flash_fullscreen.jpg"
    color: "#0D3B0F"
    icon_background_color: "#0D3B0F"
    color_dark: "#0D3B0F"
    image_dark: "assets/images/flash_fullscreen.jpg"
    icon_background_color_dark: "#0D3B0F"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
