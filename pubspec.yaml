name: azkar
description: "حصن المسلم - Hisn Al-Muslim Islamic App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Local Storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Prayer Times
  adhan: ^2.0.0+1

  # Location & Compass
  geolocator: ^13.0.2
  flutter_compass: ^0.8.0
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Audio
  just_audio: ^0.9.42

  # Utilities
  share_plus: ^10.1.4
  vibration: ^2.0.0
  intl: ^0.20.2
  hijri: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
